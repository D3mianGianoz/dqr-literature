[project]
name = "dqr-literature"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "spacy",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
papers = "related_work.papers:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["related_work"]
